name: build

on:
  push:
    branches: [main]
    paths: ['src/**', 'lib/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node src/build.mjs
      - name: Commit built index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html up to date, nothing to commit"
          else
            git commit -m "build: regenerate index.html from src/ [skip ci]"
            git push
          fi
